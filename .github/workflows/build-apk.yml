name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Generate android/ folder if the repo only has lib/ + pubspec.yaml.
      # Back up and restore our files so flutter create can't overwrite them.
      - name: Create platform folders if missing
        run: |
          if [ ! -d android ]; then
            cp lib/main.dart /tmp/main.dart
            cp pubspec.yaml /tmp/pubspec.yaml
            flutter create --platforms=android --project-name buddy_assistant .
            cp /tmp/main.dart lib/main.dart
            cp /tmp/pubspec.yaml pubspec.yaml
            rm -rf test
          fi

      - name: Download Vosk model
        run: |
          mkdir -p assets/models
          curl -fL --retry 3 -o assets/models/vosk-model-small-en-us-0.15.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          SIZE=$(stat -c%s assets/models/vosk-model-small-en-us-0.15.zip)
          echo "model size: $SIZE bytes"
          test "$SIZE" -gt 10000000
          unzip -tq assets/models/vosk-model-small-en-us-0.15.zip

      - name: Patch Android project
        run: python3 tools/patch_android.py

      - name: Get dependencies
        run: flutter pub get

      # --no-shrink: R8 can strip the JNA classes Vosk needs at runtime
      - name: Build APK
        run: flutter build apk --release --no-shrink --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: buddy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
